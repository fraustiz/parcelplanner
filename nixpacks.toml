# Node 22.23.4 : corrige la faille Brotli (CVE-2026-111497). Le nixpkgs par défaut de Nixpacks
# fournit Node 24.10.0, et aucune branche de nixpkgs n'a encore 24.22.1 (2026-10-25) : repasser en
# 24 quand elle y sera.
[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36" # nixos-26.05, 2026-10-21
